name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt ruff

      - name: Lint
        run: ruff check backend

      - name: Test
        run: python -m pytest backend/tests -q

      - name: Build Docker image
        run: docker build -f docker/Dockerfile.backend -t robot-backend .
